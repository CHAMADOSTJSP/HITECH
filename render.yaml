# Blueprint para demonstração/homologação econômica. Revise planos e preços
# no painel/documentação do Render antes de uma implantação comercial.
services:
  - type: web
    name: hitech-voltguard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voltguard-db
          property: connectionString
      - key: SIMULATE_TELEMETRY
        value: "0"
      # Atrás do proxy do Render: usa o IP real do cliente nos limites de requisição.
      # Confirme nos logs que IPs distintos aparecem antes de depender disso.
      - key: TRUST_PROXY
        value: "1"
      - key: HISTORY_RETENTION_DAYS
        value: "180"

databases:
  - name: voltguard-db
    databaseName: voltguard
    user: voltguard_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
