<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>HITECH VoltGuard - SCADA Enterprise SaaS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1a12;
            background-image: linear-gradient(rgba(11, 26, 18, 0.85), rgba(11, 26, 18, 0.90)), url('/logo.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            color: #ffffff; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        #login-screen {
            background: rgba(15, 35, 25, 0.95);
            border: 1px solid #10b981;
            padding: 30px; border-radius: 12px; width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8); text-align: center;
        }
        h2 { margin-bottom: 5px; color: #10b981; font-size: 20px; }
        p.sub { font-size: 11px; color: #9ca3af; margin-bottom: 20px; text-transform: uppercase; }
        .input-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 10px; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
        input {
            width: 100%; padding: 8px; background: #06110b;
            border: 1px solid #065f46; border-radius: 6px; color: #fff;
            box-sizing: border-box; font-size: 12px; margin-top: 2px;
        }
        button.btn-primary {
            width: 100%; padding: 10px; background: #10b981;
            border: none; border-radius: 6px; color: #000;
            font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        button.btn-primary:hover { background: #059669; color: #fff; }
        #error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; font-weight: bold; }
        #dashboard-screen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(11, 26, 18, 0.95);
            box-sizing: border-box; padding: 20px 40px; overflow-y: auto;
        }
        .dash-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #10b98155; padding-bottom: 15px; margin-bottom: 20px;
        }
        .dash-header h1 { font-size: 18px; color: #10b981; margin: 0; }
        .panels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .panel-card { background: rgba(17, 42, 29, 0.95); border: 1px solid #065f46; border-left: 5px solid #10b981; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen">
        <h2>HITECH VoltGuard</h2>
        <p class="sub">SCADA Enterprise SaaS</p>
        <div class="input-group"><label>Usuário</label><input type="text" id="usuario" value="RafaelFelipe"></div>
        <div class="input-group"><label>Senha</label><input type="password" id="senha" value="123456"></div>
        <button type="button" class="btn-primary" onclick="realizarLogin()">Acessar Plataforma</button>
        <div id="error-msg"></div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard-screen">
        <div class="dash-header">
            <div>
                <h1>HITECH VoltGuard SCADA Enterprise</h1>
                <span>Plataforma Industrial Online</span>
            </div>
            <div>
                <button type="button" class="btn-primary" style="padding: 6px 12px; background: #ef4444; color:#fff;" onclick="location.reload()">Sair</button>
            </div>
        </div>
        <div id="main-container" class="panels-grid"></div>
    </div>

    <script>
        let tokenJwt = '';

        async function realizarLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const errEl = document.getElementById('error-msg');
            errEl.innerText = "A processar login...";

            try {
                const res = await fetch('/api/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: usuario, password: senha})
                });
                
                const data = await res.json();
                if(!res.ok) {
                    throw new Error(data.detail || "Erro ao autenticar.");
                }

                tokenJwt = data.access_token;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                carregarPaineis();
            } catch (err) {
                console.error("Erro:", err);
                errEl.innerText = "Erro: " + err.message;
            }
        }

        async function carregarPaineis() {
            try {
                const res = await fetch('/api/panels', {
                    headers: {'Authorization': `Bearer ${tokenJwt}`}
                });
                const data = await res.json();
                const container = document.getElementById('main-container');
                
                if(data.panels) {
                    container.innerHTML = data.panels.map(p => `
                        <div class="panel-card">
                            <h3>${p.id} - ${p.name}</h3>
                            <p><strong>Local:</strong> ${p.location}</p>
                            <p><strong>Tensão:</strong> ${p.voltage} | <strong>Corrente:</strong> ${p.current} A</p>
                            <p><strong>Temperatura:</strong> ${p.temperature} °C</p>
                            <p><strong>Status:</strong> ${p.status}</p>
                        </div>
                    `).join('');
                }
            } catch(e) {
                console.error("Erro ao carregar painéis:", e);
            }
        }
    </script>
</body>
</html>
