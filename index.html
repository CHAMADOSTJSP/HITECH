        }
        #login-screen {

        }

        button.btn-primary:hover { background: #059669; color: #fff; }
        #error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; }

        }

        }
        .tab-btn.active { background: #10b981; color: #000; border-color: #10b981; }

        .kpi-container {

        .panel-card h3 { margin: 0 0 10px 0; font-size: 15px; color: #10b981; }
        .panel-card.critico h3 { color: #ef4444; }
        .panel-card p { margin: 6px 0; font-size: 12px; color: #d1d5db; }
        
        .action-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-action {
            background: #10b981; border: none; color: #000; padding: 6px 12px;

        }
        .btn-action:hover { background: #059669; color: #fff; }
